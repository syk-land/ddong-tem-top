<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0e1a" />
    <!--
      앱 자체가 다크 테마 — 시스템(Android WebView, Samsung Internet "웹 어두운 모드")
      의 force-dark 자동 변환이 "이미 어두운 페이지" 를 다시 어둡게 만들지 않도록 차단.
      'only dark' 의 only 키워드는 브라우저가 우리 선언을 오버라이드하지 못하게 한다.
      (CSS 의 color-scheme 만으로는 일부 브라우저가 사용자 설정에 따라 무시한다.)
    -->
    <meta name="color-scheme" content="only dark" />
    <style>
      html {
        color-scheme: only dark;
      }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <title>ddongTemTop — This Run, Climbing with Junk Gear</title>

    <!--
      GameMonetize H5 SDK — Firebase Hosting / GameMonetize 두 트랙에서 동일 광고 네트워크 사용.

      활성화 상태 — SDK 로드 + BYPASS_ADS=false. 콘솔이 "Active" 면 정상 표시,
      "New" 단계면 no-fill 로 광고 없이 보상이 즉시 지급된다 (ads.ts fallback).

      이벤트 흐름: SDK 가 콜백으로 던지는 event 를 window 'gm-sdk-event' CustomEvent
                  로 전파 → src/lib/ads.ts 가 listen 하여 rewarded 완료 판정.
    -->
    <script>
      window.SDK_OPTIONS = {
        gameId: '5w9to8lrnly4ouwgkjxiykiaiitznvwp',
        onEvent: function (a) {
          if (a && typeof a.name === 'string') {
            window.dispatchEvent(new CustomEvent('gm-sdk-event', { detail: a }))
          }
        },
      }
    </script>
    <script async src="https://api.gamemonetize.com/sdk.js"></script>

  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
