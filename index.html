<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0e1a" />
    <!--
      앱 자체가 다크 테마 — 시스템(Android WebView) 의 force-dark 자동화가
      "이미 어두운 페이지"를 또 한 번 어둡게 만들지 않도록 명시.
      color-scheme=dark 면 브라우저/WebView 가 추가 변환을 건너뛴다.
    -->
    <meta name="color-scheme" content="dark" />
    <meta name="supported-color-schemes" content="dark" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <title>이번 판은 똥템으로 탑을 오르겠습니다</title>

    <!--
      GameMonetize H5 SDK — 브라우저(Firebase Hosting) 빌드 전용 광고 네트워크.
      안드로이드(Capacitor) 빌드에선 AdMob 을 사용하므로 sdk.js 호출은 무시되어도 무방.
      gameId 발급 절차:
        1) https://gamemonetize.com 가입 → My Games → Add New Game
        2) 발급된 GameId 를 아래 'REPLACE_WITH_REAL_GAMEID' 와 교체
        3) src/lib/ads.ts 의 BYPASS_ADS 를 false 로 변경
        4) 광고 단가/노출이 사이트 트래픽 검증 후 활성화됨
    -->
    <script>
      window.SDK_OPTIONS = {
        gameId: '5w9to8lrnly4ouwgkjxiykiaiitznvwp',
        onEvent: function (a) {
          if (a && typeof a.name === 'string') {
            window.dispatchEvent(new CustomEvent('gm-sdk-event', { detail: a }))
          }
        },
      }
    </script>
    <script async src="https://api.gamemonetize.com/sdk.js"></script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
