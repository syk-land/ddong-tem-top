name: Setup Stable Debug Keystore (one-time)

# 한 번만 수동 실행 — 안정 debug.keystore 생성 + SHA-1 출력.
# 1) Actions 탭에서 이 workflow 를 "Run workflow" 로 수동 실행
# 2) 끝나면 Artifacts 에서 debug-keystore.zip 다운로드
# 3) 압축 풀어 debug.keystore 파일을 android/app/debug.keystore 경로로 커밋
# 4) 로그 끝부분에 출력된 SHA-1 / SHA-256 을 Firebase 콘솔에 등록
on:
  workflow_dispatch:

jobs:
  setup-keystore:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Generate stable debug.keystore
        run: |
          mkdir -p out
          keytool -genkey \
            -v \
            -keystore out/debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 36500 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Print SHA-1 / SHA-256
        run: |
          echo "============================================================"
          echo "Register these fingerprints in Firebase Console:"
          echo "  Project Settings → Your apps → Android (com.climetop.app)"
          echo "  → Add fingerprint → paste SHA-1 (and SHA-256 if asked)"
          echo "============================================================"
          keytool -list -v \
            -keystore out/debug.keystore \
            -alias androiddebugkey \
            -storepass android \
            -keypass android \
            | grep -E "SHA1:|SHA-256:|SHA256:"
          echo "============================================================"

      - name: Upload keystore artifact
        uses: actions/upload-artifact@v4
        with:
          name: debug-keystore
          path: out/debug.keystore
          retention-days: 7
